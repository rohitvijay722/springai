spring.config.import=optional:file:.env[.properties]
spring.application.name=springai
# Google GenAI Configuration (For Spring AI 2.0+)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash

# CRUCIAL: If using Google GenAI, a Project ID string must be declared
# to prevent auto-configuration connection bean failures
spring.ai.google.genai.project-id=774452857225
# 2. Map your project identification sequence (use the project number you provided)
